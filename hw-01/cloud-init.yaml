#cloud-config
# по этой строке cloud-init понимает, что перед ним конфигурация, а не текст

users:
  - name: student                       # логин, под которым будете заходить по SSH
    groups: sudo                        # членство в группе даёт право на sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']    # без пароля: пароля у пользователя и нет
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGzsQWMWqsI/GtzxNYa7D+qojmU90MuFD3C6to3apfLe safronov-wsl

package_update: true                    # обновить список пакетов перед установкой

packages:
  - nginx                               # ставится при первой загрузке машины

runcmd:
  # меняем порт в конфигурации nginx: сначала IPv4, потом IPv6
  - sed -i 's/listen 80 default_server;/listen 8024 default_server;/' /etc/nginx/sites-available/default
  - sed -i 's/listen \[::\]:80 default_server;/listen [::]:8024 default_server;/' /etc/nginx/sites-available/default
  # страницу перезаписываем целиком: слово варианта и имя машины в одной строке
  - bash -c 'echo "labwork on $(hostname)" > /var/www/html/index.nginx-debian.html'
  - nginx -t                            # проверка конфигурации: опечатка вылезет здесь
  - systemctl restart nginx             # без перезапуска nginx остался бы на порту 80
